---
- name: Prepare Vector Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Vector Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Vector Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
          # The storage driver below. Docker in a container cannot use the
          # host's overlayfs, and fuse-overlayfs is several times faster than
          # falling back to vfs.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for Vector Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # `vfs` makes a full copy of every layer. The Vector image is large
          # enough for that to dominate the run - `fuse-overlayfs` gives the same
          # nested-container isolation without the copying.
          storage-driver: fuse-overlayfs

    # Bind-mounted into the Vector container through
    # `vector_container_additional_volumes`. The role does not create the source
    # of an additional volume, so it has to exist before the container is
    # created, or `docker create` refuses the bind.
    #
    # This directory is read by the `molecule_input`
    # file source. The seed file is in place before Vector ever starts.
    - name: Ensure Vector Molecule input directory exists
      ansible.builtin.file:
        path: "{{ vector_molecule_input_host_path }}"
        state: directory
        mode: "0755"

    - name: Ensure Vector Molecule seed log file exists
      ansible.builtin.copy:
        content: "{{ vector_molecule_seed_marker }} seeded before Vector started\n"
        dest: "{{ vector_molecule_input_host_path }}/seed.log"
        mode: "0644"

    # Left over from a previous run of the scenario on the same machine, it would
    # make the "live" assertion pass without the pipeline having done anything.
    - name: Ensure Vector Molecule live log file is absent
      ansible.builtin.file:
        path: "{{ vector_molecule_input_host_path }}/live.log"
        state: absent
